# ld65 configuration for demo.prg: a 3-byte PRG header (load address and
# bank), then the program at $8000 in extended RAM bank 1. Zero page comes
# from $98-$DF, the block the ROM leaves free for programs.
MEMORY {
    ZP:     start = $98,   size = $48,   type = rw;
    HEADER: start = $0000, size = $0003, file = %O;
    BANK1:  start = $8000, size = $4000, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    HEADER:   load = HEADER, type = ro;
    CODE:     load = BANK1,  type = ro;
    RODATA:   load = BANK1,  type = ro;
    BSS:      load = BANK1,  type = bss;
}
