name: Release

# Builds the emulator on each platform's own runner: sound on Linux needs cgo
# and the ALSA headers, so Linux builds cannot be cross-compiled. Every push
# and pull request builds and smoke-tests the packages; a v* tag also attaches
# them to that GitHub release. A tag with a prerelease suffix (v0.4.0-alpha.1)
# makes a prerelease.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: linux-amd64}
          - {os: ubuntu-24.04-arm, target: linux-arm64}
          - {os: macos-latest, target: darwin-arm64}
          - {os: macos-15-intel, target: darwin-amd64}
          - {os: windows-latest, target: windows-amd64}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build
        env:
          CGO_ENABLED: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: |
          case "$GITHUB_REF" in refs/tags/v*) version="$GITHUB_REF_NAME" ;; *) version="dev-${GITHUB_SHA::7}" ;; esac
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          name="clementina-emulator-$version-${{ matrix.target }}"
          dir="dist/$name"
          mkdir -p "$dir/assets/computer/beneater"
          ldflags="-X github.com/fran150/clementina-6502/internal/buildinfo.Version=$version"
          go build -trimpath -ldflags "$ldflags" -o "$dir/clementina-emulator$ext" ./cmd
          go build -trimpath -ldflags "$ldflags" -o "$dir/clementina-automation$ext" ./cmd/clementina-automation
          cp assets/computer/beneater/*.bin "$dir/assets/computer/beneater/"
          # The sample SD card folder: ./clementina-emulator --sd SD
          cp -R SD "$dir/SD"
          cp README.md LICENSE "$dir/"
          echo "PACKAGE_DIR=$dir" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=$name" >> "$GITHUB_ENV"
          echo "EXT=$ext" >> "$GITHUB_ENV"
      - name: Smoke test
        run: |
          "$PACKAGE_DIR/clementina-emulator$EXT" --help
          "$PACKAGE_DIR/clementina-emulator$EXT" --version
          "$PACKAGE_DIR/clementina-automation$EXT" --version
          "$PACKAGE_DIR/clementina-automation$EXT" > endpoint.txt &
          pid=$!
          for _ in $(seq 1 30); do grep -q '^http://127.0.0.1:[0-9]*/v1' endpoint.txt && break; sleep 1; done
          cat endpoint.txt
          kill "$pid" || true
          grep -q '^http://127.0.0.1:[0-9]*/v1' endpoint.txt
      - name: Archive
        run: |
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$PACKAGE_NAME.zip" "$PACKAGE_NAME" >/dev/null
          else
            tar -czf "$PACKAGE_NAME.tar.gz" "$PACKAGE_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Attach packages to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes "${prerelease[@]}"
          gh release upload "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --clobber
